<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISCELLANEOUS TAGS</title>
</head>
<body>
    
        <!-- SCRIPT TAG -->
        <script>
            alert("This is script tag example.");
        </script>

        <!-- STYLE TAG -->
        <style>
            body {
                background-color: lightgray;
            }
            h1 {
                color: blue;
            }
        </style>

        <!-- LINK TAG -->
        <link rel="stylesheet" href="style.css">

        <!-- CANVAS TAG -->
        <canvas id="myCanvas" width="200" height="100">
            Your browser does not support the canvas tag.
        </canvas>

        <!-- SVG TAG -->

        <h2>SVG Circle</h2>
        <svg width="200" height="200">
          <circle cx="100" cy="100" r="80" fill="blue"/>
        </svg>

        <h2>SVG Rectangle</h2>
        <svg width="200" height="200">
          <rect x="20" y="20" width="150" height="100" fill="green"/>
        </svg>

        <h2>SVG Line</h2>
        <svg width="200" height="200">
          <line x1="10" y1="10" x2="190" y2="190" stroke="black" stroke-width="3"/>
        </svg>

        <h2>SVG Ellipse</h2>
        <svg width="200" height="200">
          <ellipse cx="100" cy="100" rx="80" ry="40" fill="purple"/>
        </svg>

        <h2>SVG Polygon</h2>
        <svg width="200" height="200">
          <polygon points="100,10 40,180 190,60 10,60 160,180" fill="orange"/>
        </svg>

        <h2>SVG Text</h2>
        <svg width="300" height="100">
          <text x="20" y="50" font-size="30" fill="red">Hello SVG</text>
        </svg>

        <h2>SVG Triangle</h2>
        <svg width="200" height="200">
          <polygon points="100,20 20,180 180,180" fill="blue"/>
        </svg>

        <h2>SVG Rounded Rectangle</h2>
        <svg width="200" height="200">
          <rect x="20" y="20" width="150" height="100" rx="20" ry="20" fill="pink"/>
        </svg>


</body>
</html>
