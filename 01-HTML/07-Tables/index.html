<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLE TAGS </title>
</head>
<body>
  
    <!-- TABLE TAG -->
    <table border="1">

        <!-- CAPTION TAG -->
        <caption>Student Details Table</caption>

            <!-- THEAD TAG -->
            <thead>
                <tr>
                    <!-- TABLE HEADING TAG -->
                    <th>Name</th>
                    <th>Age</th>
                    <th>City</th>
                </tr>
            </thead>
        
            <!-- TBODY TAG -->
            <tbody>
                <!-- TABLE ROW TAG -->
                <tr>
                    <!-- TABLE DATA TAG -->
                    <td>Rahul</td>
                    <td>20</td>
                    <td>Mumbai</td>
                </tr>
                <tr>
                    <td>Sneha</td>
                    <td>21</td>
                    <td>Delhi</td>
                </tr>
            
                <!-- COLSPAN ATTRIBUTE -->
                <tr>
                    <td colspan="3">This row uses colspan attribute.</td>
                </tr>
            
                <!-- ROWSPAN ATTRIBUTE -->
                <tr>
                    <td rowspan="2">Aman</td>
                    <td>22</td>
                    <td>Pune</td>
                </tr>
                <tr>
                    <td>23</td>
                    <td>Nashik</td>
                </tr>
            </tbody>
        
            <!-- TFOOT TAG -->
            <tfoot>
                <tr>
                    <td colspan="3">End of table example.</td>
                </tr>
            </tfoot>

    </table>


</body>
</html>
