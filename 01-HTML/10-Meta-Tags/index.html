<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>META TAGS</title>
</head>
<body>


      <!-- META TAG -->
      <meta charset="UTF-8">
      
      <!-- CHARSET ATTRIBUTE -->
      <meta charset="UTF-8">
      
      <!-- DESCRIPTION META TAG -->
      <meta name="description" content="This is an HTML meta description example for web page summary.">
      
      <!-- KEYWORDS META TAG -->
      <meta name="keywords" content="HTML, CSS, JavaScript, Web Development">
      
      <!-- VIEWPORT META TAG -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <!-- SVG -->
    <h2>SVG Circle</h2>
<svg width="200" height="200">
  <circle cx="100" cy="100" r="80" fill="blue"/>
</svg>

<h2>SVG Rectangle</h2>
<svg width="200" height="200">
  <rect x="20" y="20" width="150" height="100" fill="green"/>
</svg>

<h2>SVG Line</h2>
<svg width="200" height="200">
  <line x1="10" y1="10" x2="190" y2="190" stroke="black" stroke-width="3"/>
</svg>

<h2>SVG Ellipse</h2>
<svg width="200" height="200">
  <ellipse cx="100" cy="100" rx="80" ry="40" fill="purple"/>
</svg>

<h2>SVG Polygon</h2>
<svg width="200" height="200">
  <polygon points="100,10 40,180 190,60 10,60 160,180" fill="orange"/>
</svg>

<h2>SVG Text</h2>
<svg width="300" height="100">
  <text x="20" y="50" font-size="30" fill="red">Hello SVG</text>
</svg>

<h2>SVG Triangle</h2>
<svg width="200" height="200">
  <polygon points="100,20 20,180 180,180" fill="blue"/>
</svg>

<h2>SVG Rounded Rectangle</h2>
<svg width="200" height="200">
  <rect x="20" y="20" width="150" height="100" rx="20" ry="20" fill="pink"/>
</svg>



    
</body>
</html>
