<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINK TAGS</title>
</head>
<body>

    
    <!-- ANCHOR TAG -->
    <a href="https://www.google.com" target="_blank">Visit Google website</a>

    <!-- HREF ATTRIBUTE -->
    <a href="https://www.youtube.com">This link uses href attribute.</a>

    <!-- TARGET ATTRIBUTE -->
    <a href="https://www.wikipedia.org" target="_blank">This link opens in a new tab using target attribute.</a>

</body>
</html>
