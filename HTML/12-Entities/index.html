<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTITIES</title>
</head>
<body>
    
    <!-- LESS THAN ENTITY -->
    &lt; represents the less than symbol.
    
    <!-- GREATER THAN ENTITY -->
    &gt; represents the greater than symbol.
    
    <!-- AMPERSAND ENTITY -->
    &amp; represents the ampersand symbol.
    
    <!-- NON-BREAKING SPACE ENTITY -->
    Hello&nbsp;World (This adds extra space between words).
    
    <!-- COPYRIGHT ENTITY -->
    &copy; 2026 Your Company Name.
    
    <!-- REGISTERED TRADEMARK ENTITY -->
    OpenAI&reg; is a registered trademark example.
    
</body>
</html>
