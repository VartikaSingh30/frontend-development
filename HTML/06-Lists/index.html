<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIST TAGS</title>
</head>
<body>

    <!-- UNORDERED LIST TAG -->
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
    </ul>
    
    <!-- ORDERED LIST TAG -->
    <ol>
        <li>Wake up</li>
        <li>Study</li>
        <li>Sleep</li>
    </ol>
    
    <!-- LIST ITEM TAG -->
    <li>This is list item tag example.</li>
    
    <!-- DESCRIPTION LIST TAG -->
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
    </dl>
    
    <!-- DESCRIPTION TERM TAG -->
    <dt>CSS</dt>
    
    <!-- DESCRIPTION DETAILS TAG -->
    <dd>Cascading Style Sheets</dd>


</body>
</html>
