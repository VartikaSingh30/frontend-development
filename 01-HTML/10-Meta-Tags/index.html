<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>META TAGS</title>
</head>
<body>


    <!-- META TAG -->
       <meta charset="UTF-8">
      
    <!-- CHARSET ATTRIBUTE -->
      <meta charset="UTF-8">
      
    <!-- DESCRIPTION META TAG -->
      <meta name="description" content="This is an HTML meta description example for web page summary.">
      
    <!-- KEYWORDS META TAG -->
      <meta name="keywords" content="HTML, CSS, JavaScript, Web Development">
      
    <!-- VIEWPORT META TAG -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

   


    
</body>
</html>
