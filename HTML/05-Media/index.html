<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA TAGS</title>
</head>
<body>
    
    <!-- IMAGE TAG -->
    <img src="nature.jpg" alt="Beautiful nature view" width="400">
    <br>
    
    <!-- SRC ATTRIBUTE -->
    <img src="photo.jpg" alt="This image uses src attribute" width="400">
    <br>
    
    <!-- ALT ATTRIBUTE -->
    <img src="flower.jpg" alt="Red flower image" width="400">
    <br>
    
    <!-- AUDIO TAG -->
    <audio controls>
        <source src="song.mp3" type="audio/mpeg" width="400">
    </audio>
    <br>
    
    <!-- VIDEO TAG -->
    <video controls width="400">
        <source src="movie.mp4" type="video/mp4" width="400">
    </video>
    
    <!-- SOURCE TAG -->
    <source src="sample.mp4" type="video/mp4">
    
    <!-- IFRAME TAG -->
    <iframe src="https://www.wikipedia.org" width="500" height="300"></iframe>
    
    <!-- FIGURE TAG -->
    <figure>
        <img src="mountain.jpg" alt="Mountain view" width="400">
    </figure>
    
    <!-- FIGCAPTION TAG -->
    <figcaption>This is image caption example.</figcaption>
           

   

    

 

</body>
</html>
