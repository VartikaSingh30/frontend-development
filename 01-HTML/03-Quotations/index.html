<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUOTATION TAGS</title>
</head>
<body>
    
    <!-- BLOCKQUOTE TAG -->
<blockquote>"Success is not final, failure is not fatal: It is the courage to continue that counts."</blockquote>

<!-- QUOTATION TAG -->
<q>Knowledge is power.</q>

<!-- ABBREVIATION TAG -->
<abbr title="HyperText Markup Language">HTML</abbr> is used to create web pages.

<!-- ADDRESS TAG -->
<address>123 Main Street, Mumbai, Maharashtra, India</address>

<!-- CITE TAG -->
<cite>The Wings of Fire</cite> is a famous book by Dr. A.P.J. Abdul Kalam.
    
    
</body>
</html>
